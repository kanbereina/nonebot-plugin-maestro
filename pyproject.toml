[project]
name = "nonebot-plugin-maestro"
version = "0.4.1"
description = "QQ 官方机器人指令面板可视化管理工具"
readme = "README.md"
requires-python = ">=3.12, <3.14"
authors = [{ name = "KanbeReina", email = "kano.2525@qq.com" }]
license = { text = "MIT" }
keywords = ["nonebot", "nonebot2", "qq", "panel", "webui"]
dependencies = [
  # WebUI 自带 uvicorn，不复用 NoneBot 的 ASGI 服务端
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  # nonebot2 本体只带驱动抽象；QQ 适配器在 setup() 时强制要求 driver 提供
  # HTTPClientMixin（QQ_BOTS 配置 websocket 连接时还要 WebSocketClientMixin），
  # httpx 驱动实现由插件显式声明（范围与 nonebot2 对应 extra 的声明一致），
  # 不能让宿主装完插件后连 API 请求都发不出去
  "nonebot2>=2.5.0,<3.0.0",
  "httpx[http2]>=0.26.0,<1.0.0",
  # 指令面板是 QQ OpenAPI 专有接口，适配器为直接依赖
  # 下限 1.7.2：其声明 nonebot2>=2.5.0,<3
  "nonebot-adapter-qq>=1.7.2,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/kanbereina/nonebot-plugin-maestro"
Issues = "https://github.com/kanbereina/nonebot-plugin-maestro/issues"
Repository = "https://github.com/kanbereina/nonebot-plugin-maestro.git"

[dependency-groups]
dev = [
  "bump-my-version>=1.2.7",
  "poethepoet>=0.42.1",
  "ruff>=0.15.2,<1.0.0",
  # 沿用本项目既有的类型检查器（模板用 basedpyright，此处不替换）
  "pyrefly>=1.2.0",
  { include-group = "test" },
]
test = [
  "nonebug>=0.4.4,<1.0.0",
  "poethepoet>=0.42.1",
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.3.0,<1.4.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  # 路由测试用 TestClient，它依赖 httpx
  "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nonebot_plugin_maestro"

[tool.bumpversion]
# commit/tag 均关闭：main 受分支保护，发版走「改版本号 -> PR -> 合并」，
# 不再由本地 bump 直接 commit+tag+push。release.yml 检测到 main 上
# pyproject.toml 的版本号变化后才打 tag、发 Release、发布 PyPI。
current_version = "0.4.1"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"nonebot-plugin-maestro\"\nversion = \"{current_version}\""
replace = "name = \"nonebot-plugin-maestro\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/nonebot_plugin_maestro/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[tool.nonebot]
plugins = ["nonebot_plugin_maestro"]

[tool.poe.tasks]
test = "pytest --cov=src --cov-report xml --junitxml=./junit.xml -n auto"
typecheck = "pyrefly check"
lint = "ruff check ."
format = "ruff format ."
# 只改文件（不 commit/tag，见 [tool.bumpversion]）：改完后自行走
# git add + commit + 开 PR，合并到 main 才会触发发版
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers", # 严格标记模式
  "--tb=short",       # 简短的错误回溯
  "-ra",              # 显示所有测试结果摘要
]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string（中文标点）
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyrefly]
# tests/ 不纳入：大量假对象与 monkeypatch，按 strict 会产生数百条 cast 噪音
project-includes = ["src", "bot.py"]
preset = "strict"
