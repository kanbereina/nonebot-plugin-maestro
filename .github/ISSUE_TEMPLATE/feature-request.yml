name: ✨ 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 提交前请先搜索现有 issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个功能解决什么问题？当前是怎么绕过的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的实现
      description: 希望它如何工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: WebUI 界面
        - label: 面板 API 调用
        - label: 配置项
        - label: 文档

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
